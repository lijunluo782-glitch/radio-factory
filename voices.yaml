# 声音角色库 —— 跨频道共享的音色资源池,不属于某一个频道,所以没放进 channels/
# (放那儿会被 `rf channels` 当成一个频道去解析,直接报错)。
#
# Segment.voice 字段里写的是"角色 id"(narrator / crumb / bubble / ...),
# 这张表把角色 id 映射到 MiniMax 实际的 voice_id + 默认语速/音量/音高,
# 给 script.py 的 tts_tasks() 用。
#
# 依据:MiniMax T2A API(platform.minimax.io/docs/api-reference/speech-t2a-http)。
# 2026-08-17 用真实 API key 跑过 `rf voices` 核验过一遍(公司中转账号,
# 走的是 api.minimax.chat 这个国内域名,不是 api.minimax.io)——
# CrispGirl/SoftGirl 当时是照公开文档瞎猜的写法,实际账号里的真名带下划线
# (Crisp_Girl / Soft_Girl),已经改过来。narrator / crumb / salt 三个当时就猜对了。
# 换账号或者 MiniMax 改名字之后,记得重新跑一遍 `rf voices` 核对。

narrator:
  voice_id: "Chinese (Mandarin)_Radio_Host"
  speed: 1.0
  vol: 1.0
  pitch: 0
  note: 默认旁白/主持音色,电台广播感,亲切不端着

characters:
  # 这些是"这个物件自己在说话"时用的音色,跟 PROMPT.md"多角色演绎"一节配套。
  # 同一个角色 id 尽量跨脚本复用,别每期新起一个——不然这张表会失控膨胀。
  crumb:
    voice_id: "Chinese (Mandarin)_Straightforward_Boy"
    speed: 1.05
    vol: 1.0
    pitch: 0
    note: 直来直去、有点犟——面包渣/盐粒这类"死不悔改"的调皮物件用这个
  bubble:
    voice_id: "Chinese (Mandarin)_Crisp_Girl"
    speed: 1.1
    vol: 1.0
    pitch: 0
    note: 明快、语速偏快——适合起哄、抱怨拥挤这种小情绪
  salt:
    voice_id: "Chinese (Mandarin)_Unrestrained_Young_Man"
    speed: 1.05
    vol: 1.0
    pitch: 0
    note: 大大咧咧、嗓门大——适合喊冤/抗议
  nose:
    voice_id: "Chinese (Mandarin)_Soft_Girl"
    speed: 0.95
    vol: 1.0
    pitch: 0
    note: 偏软、略闷——适合"堵住""委屈"这类状态

# 新增一个角色 voice id 时:
#   1. 先看这张表里现有几个够不够用(直来直去/明快/大大咧咧/委屈这几种基础
#      情绪原型,大部分拟人化台词都能往里套,不必每次都新起一个)
#   2. 真不够用,在 characters 下面加一条,note 写清楚"什么情绪原型用它"
#   3. nature 频道有禁拟人化红线,这张表里的角色音色不能用在 nature 频道的
#      动植物身上(细节见 PROMPT.md"多角色演绎"一节)
